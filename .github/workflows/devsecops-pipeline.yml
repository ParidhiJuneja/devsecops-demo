name: DevSecOps Pipeline — Enterprise Edition

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: devsecops-demo
  IMAGE_TAG: ${{ github.sha }}
  PYTHON_VERSION: "3.11"

jobs:

  # ============================================================
  # STAGE 1 - SECRETS SCAN
  # Runs first - fastest check, most critical
  # Scans full git history for API keys, passwords, tokens
  # ============================================================
  secrets-scan:
    name: "Stage 1 — Secrets Scan (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # STAGE 2 - UNIT TESTS + CODE COVERAGE
  # Only runs if secrets scan passes
  # Coverage report passed to SonarCloud later
  # ============================================================
  unit-tests:
    name: "Stage 2 — Unit Tests (pytest)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Run pytest with coverage
        run: |
          pip install pytest pytest-cov
          pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================
  # STAGE 3a - SAST WITH SEMGREP
  # Fast pattern-based scanning
  # Runs OWASP Top 10 rules + our custom rules
  # Uploads results to GitHub Security tab as SARIF
  # ============================================================
  sast-semgrep:
    name: "Stage 3a — SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/secrets
            p/sql-injection
            .semgrep.yml
          generateSarif: "1"

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ============================================================
  # STAGE 3b - SAST WITH SONARCLOUD
  # Deep analysis - data flow, security hotspots,
  # code quality, coverage tracking, quality gate
  # ============================================================
  sast-sonarcloud:
    name: "Stage 3b — SAST (SonarCloud)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # STAGE 4 - SCA (SOFTWARE COMPOSITION ANALYSIS)
  # Scans all Python dependencies against CVE databases
  # Catches vulnerable third-party libraries
  # ============================================================
  sca:
    name: "Stage 4 — SCA (pip-audit)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install app dependencies
        run: pip install -r src/requirements.txt

      - name: Run pip-audit
        run: |
          pip-audit \
            --requirement src/requirements.txt \
            --format json \
            -o pip-audit-results.json || true

      - name: Show SCA results
        run: |
          echo "=== SCA Results ==="
          cat pip-audit-results.json || echo "No results file found"

      - name: Upload SCA results artifact
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: pip-audit-results.json

  # ============================================================
  # STAGE 5 - CONTAINER BUILD
  # Builds Docker image from hardened Dockerfile
  # Multi-stage build, non-root user, minimal base image
  # Saves image as artifact for scanning and deployment
  # ============================================================
  container-build:
    name: "Stage 5 — Container Build"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sast-sonarcloud, sca]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Save image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ============================================================
  # STAGE 6 - CONTAINER SCAN WITH TRIVY
  # Scans Docker image for:
  #   - OS level CVEs (apt packages)
  #   - Application dependency CVEs
  #   - Dockerfile misconfigurations
  # Uploads to GitHub Security tab
  # ============================================================
  container-scan:
    name: "Stage 6 — Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: container-build
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: sarif
          output: trivy-vuln.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Run Trivy — config/Dockerfile scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload Trivy vulnerability SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vulnerabilities

      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-misconfig

  # ============================================================
  # STAGE 7 - IAC SECURITY SCAN WITH CHECKOV
  # Scans Terraform for misconfigurations:
  #   - Open S3 buckets
  #   - SSH open to world (0.0.0.0/0)
  #   - Unencrypted EBS volumes
  #   - Missing CloudTrail logging
  # ============================================================
  iac-scan:
    name: "Stage 7 — IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov — Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ============================================================
  # STAGE 8 - DAST WITH OWASP ZAP
  # Starts the app, then attacks it with real payloads
  # Baseline = passive scan (safe for any environment)
  # Only runs on push not PR (avoid duplicate scans)
  # ============================================================
  dast:
    name: "Stage 8 — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [container-scan, iac-scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install app and start server
        run: |
          pip install -r src/requirements.txt
          cd src && python app.py &
          for i in {1..30}; do
            curl -sf http://localhost:5000/health && echo "App is ready" && break
            echo "Waiting for app... ($i/30)"
            sleep 1
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: warn
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

  # ============================================================
  # STAGE 9 - SECURITY GATE
  # Aggregates ALL security findings
  # Defines pass/fail thresholds
  # Hard fails: secrets, critical SAST
  # Soft fails: container CVEs, IaC misconfigs, DAST warnings
  # ============================================================
  security-gate:
    name: "Stage 9 — Security Gate"
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-semgrep, sast-sonarcloud, sca, container-scan, iac-scan, dast]
    if: always()
    steps:
      - name: Evaluate security gate
        run: |
          echo "========================================"
          echo "       SECURITY GATE EVALUATION"
          echo "========================================"
          echo ""

          GATE_PASS=true

          echo "Stage Results:"
          echo "  Stage 1 - Secrets scan:    ${{ needs.secrets-scan.result }}"
          echo "  Stage 3a - SAST Semgrep:   ${{ needs.sast-semgrep.result }}"
          echo "  Stage 3b - SAST Sonar:     ${{ needs.sast-sonarcloud.result }}"
          echo "  Stage 4 - SCA pip-audit:   ${{ needs.sca.result }}"
          echo "  Stage 6 - Container scan:  ${{ needs.container-scan.result }}"
          echo "  Stage 7 - IaC scan:        ${{ needs.iac-scan.result }}"
          echo "  Stage 8 - DAST ZAP:        ${{ needs.dast.result }}"
          echo ""

          echo "--- Hard Gates (will fail build) ---"

          if [ "${{ needs.secrets-scan.result }}" = "failure" ]; then
            echo "HARD FAIL: Secrets found in code or history"
            echo "Action: Rotate secret immediately, purge from git history"
            GATE_PASS=false
          fi

          if [ "${{ needs.sast-semgrep.result }}" = "failure" ]; then
            echo "HARD FAIL: Critical SAST findings from Semgrep"
            echo "Action: Fix injection vulnerabilities before merging"
            GATE_PASS=false
          fi

          if [ "${{ needs.sca.result }}" = "failure" ]; then
            echo "HARD FAIL: Critical vulnerable dependencies found"
            echo "Action: Update requirements.txt with patched versions"
            GATE_PASS=false
          fi

          echo ""
          echo "--- Soft Gates (warnings, review required) ---"

          if [ "${{ needs.sast-sonarcloud.result }}" = "failure" ]; then
            echo "WARNING: SonarCloud quality gate failed"
            echo "Action: Review findings at sonarcloud.io"
          fi

          if [ "${{ needs.container-scan.result }}" = "failure" ]; then
            echo "WARNING: Container vulnerabilities found"
            echo "Action: Review Trivy report in GitHub Security tab"
          fi

          if [ "${{ needs.iac-scan.result }}" = "failure" ]; then
            echo "WARNING: IaC misconfigurations found"
            echo "Action: Review Checkov findings in GitHub Security tab"
          fi

          if [ "${{ needs.dast.result }}" = "failure" ]; then
            echo "WARNING: DAST found runtime vulnerabilities"
            echo "Action: Review ZAP report artifact"
          fi

          echo ""
          echo "========================================"
          if [ "$GATE_PASS" = "true" ]; then
            echo "SECURITY GATE: PASSED"
            echo "Build is cleared for deployment approval"
          else
            echo "SECURITY GATE: FAILED"
            echo "Fix all hard gate failures before deploying"
            exit 1
          fi
          echo "========================================"

  # ============================================================
  # STAGE 10 - DEPLOY TO STAGING (automatic)
  # Runs automatically after security gate passes
  # No manual approval needed for staging
  # ============================================================
  deploy-staging:
    name: "Stage 10a — Deploy to Staging"
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: http://staging.devsecops-demo.com
    steps:
      - name: Deploy to staging
        run: |
          echo "========================================"
          echo "Deploying to STAGING environment"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "========================================"
          echo "Real commands would go here:"
          echo "  docker push registry/image:tag"
          echo "  kubectl apply -f k8s/staging/"
          echo "  aws ecs update-service --cluster staging ..."
          echo "Staging deployment complete"

      - name: Run smoke tests on staging
        run: |
          echo "Running smoke tests against staging..."
          echo "curl https://staging.devsecops-demo.com/health"
          echo "Smoke tests passed"

  # ============================================================
  # STAGE 11 - MANUAL APPROVAL FOR PRODUCTION
  # Pipeline PAUSES here and waits for human approval
  # Sends notification to required reviewers
  # Reviewer checks: security gate results, ZAP report,
  # SonarCloud dashboard, Trivy findings
  # ============================================================
  approve-production:
    name: "Stage 11 — Manual Approval for Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    steps:
      - name: Production deployment approved
        run: |
          echo "Production deployment approved by reviewer"
          echo "Proceeding with Blue/Green deployment"

  # ============================================================
  # STAGE 12 - BLUE/GREEN DEPLOY TO PRODUCTION
  # Zero downtime deployment strategy
  # 1. Deploy new version to Green environment
  # 2. Run health checks on Green
  # 3. Switch traffic from Blue to Green
  # 4. Keep Blue running for instant rollback
  # ============================================================
  deploy-production:
    name: "Stage 12 — Blue/Green Deploy to Production"
    runs-on: ubuntu-latest
    needs: approve-production
    environment:
      name: production
      url: http://devsecops-demo.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Blue/Green deployment
        run: |
          echo "========================================"
          echo "BLUE/GREEN DEPLOYMENT TO PRODUCTION"
          echo "========================================"
          echo ""
          echo "Step 1: Identify current active environment"
          echo "  Checking load balancer... Current: BLUE"
          echo ""
          echo "Step 2: Deploy new version to GREEN"
          echo "  Deploying ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} to GREEN"
          echo "  Real command: kubectl apply -f k8s/production/green/"
          echo "  Waiting for GREEN pods to be ready..."
          echo ""
          echo "Step 3: Health check on GREEN environment"
          echo "  curl http://green.internal/health → 200 OK"
          echo "  All health checks passed"
          echo ""
          echo "Step 4: Switch traffic BLUE → GREEN"
          echo "  Updating load balancer rules..."
          echo "  Real command: aws elbv2 modify-rule ..."
          echo "  Traffic now flowing to GREEN (new version)"
          echo ""
          echo "Step 5: Monitor for 5 minutes"
          echo "  Error rate: 0.00%"
          echo "  Latency p99: 120ms"
          echo "  All metrics healthy"
          echo ""
          echo "Step 6: Keep BLUE on standby for rollback"
          echo "  BLUE environment kept running"
          echo "  Rollback command: switch traffic back to BLUE"
          echo ""
          echo "DEPLOYMENT COMPLETE"
          echo "Version: ${{ env.IMAGE_TAG }}"
          echo "========================================"

      - name: Notify team on success
        run: |
          echo "Sending deployment notification..."
          echo "In real pipeline:"
          echo "curl -X POST SLACK_WEBHOOK \\"
          echo "  -d '{\"text\": \"Deployed ${{ env.IMAGE_TAG }} to production\"}'"

  # ============================================================
  # STAGE 13 - POST DEPLOYMENT SECURITY CHECK
  # Run a final ZAP baseline against production
  # Verify security headers are in place
  # Alert if anything unexpected is found
  # ============================================================
  post-deploy-check:
    name: "Stage 13 — Post-Deploy Security Check"
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Post-deployment verification
        run: |
          echo "========================================"
          echo "POST-DEPLOYMENT SECURITY VERIFICATION"
          echo "========================================"
          echo ""
          echo "Checking production health endpoint..."
          echo "Verifying security headers present..."
          echo "Checking TLS certificate validity..."
          echo "Running final smoke tests..."
          echo ""
          echo "In real pipeline:"
          echo "curl -I https://devsecops-demo.com | grep -E"
          echo "  'Strict-Transport-Security|X-Frame-Options|Content-Security-Policy'"
          echo ""
          echo "All post-deployment checks passed"
          echo "========================================"

      - name: Upload final pipeline summary
        run: |
          echo "========================================"
          echo "PIPELINE COMPLETE - FULL SUMMARY"
          echo "========================================"
          echo "Commit:          ${{ github.sha }}"
          echo "Branch:          ${{ github.ref_name }}"
          echo "Triggered by:    ${{ github.actor }}"
          echo ""
          echo "Security checks completed:"
          echo "  Secrets scan:       GitLeaks"
          echo "  SAST:               Semgrep + SonarCloud"
          echo "  SCA:                pip-audit"
          echo "  Container scan:     Trivy"
          echo "  IaC scan:           Checkov"
          echo "  DAST:               OWASP ZAP"
          echo "  Manual approval:    Required reviewers"
          echo "  Deployment:         Blue/Green"
          echo "  Post-deploy check:  Security headers"
          echo "========================================"